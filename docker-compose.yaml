services:
  client:
    build:
      context: ./
      dockerfile: client/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/client-app/src
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_HOST=0.0.0.0 
  
  server:
    build:
      context: ./
      dockerfile: ./server/Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./server/:/server-app
    env_file:
      - .env
    # environment: